[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-shx"
version = "0.1.0"
description = "Autonomous Terminal Coding Agent with multi-provider LLM support, interactive TUI, and safety controls"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Agentic-SHX Team"}
]
keywords = ["agent", "terminal", "cli", "llm", "autonomous", "developer-tools"]
dependencies = [
    "rich>=13.7.0",
    "prompt-toolkit>=3.0.40",
    "httpx>=0.27.0",
    "pyyaml>=6.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[project.scripts]
agn = "agentic_shx.cli:main"
agentic-shx = "agentic_shx.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["agentic_shx*"]
